name: Frontend bug
description: Report a reproducible reviewer-console defect using synthetic data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal data, private endpoints, or vulnerability details.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the affected route or workflow and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps using public-safe data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation evidence
      description: Include relevant test output, browser, and viewport without sensitive data.
    validations:
      required: true
